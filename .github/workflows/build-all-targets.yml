name: Build Ruach To-do (Windows, Linux & Android)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller kivy==2.3.2 plyer google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Build Windows executable
        # The hosted runner has no OpenGL 2.0 device. Without this, importing
        # Kivy during PyInstaller analysis calls sys.exit() and stalls the job.
        env:
          KIVY_GL_BACKEND: mock
        shell: pwsh
        run: |
          $entry = if (Test-Path "app.py") { "app.py" } else { "main.py" }
          # Static Kivy hook avoids the slow collect_submodules('kivy.core')
          # scan that stalls the Windows runner.
          $extraArgs = @(
            "--hidden-import", "todo_logic",
            "--hidden-import", "gcal_sync",
            "--hidden-import", "plyer.platforms.win.notification",
            "--hidden-import", "googleapiclient.discovery",
            "--hidden-import", "google.oauth2.credentials",
            "--hidden-import", "google_auth_oauthlib.flow",
            "--hidden-import", "google.auth.transport.requests",
            "--additional-hooks-dir", "packaging/hooks"
          )
          if (Test-Path "ruach_ai.png") {
            $extraArgs += @("--add-data", "ruach_ai.png;.")
          }
          pyinstaller --noconsole --onefile --clean --name "RuachTodo" @extraArgs $entry

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuachTodo-Windows-EXE
          path: dist/RuachTodo.exe

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages and PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          python -m pip install --upgrade pip
          pip install pyinstaller kivy==2.3.2 plyer google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Run logic tests
        run: python -m unittest discover -s tests -v

      - name: Build Linux binary
        run: |
          ENTRY=$([ -f "app.py" ] && echo "app.py" || echo "main.py")
          EXTRA_ARGS=(--hidden-import todo_logic --hidden-import gcal_sync --collect-submodules plyer.platforms.linux --hidden-import googleapiclient.discovery --hidden-import google.oauth2.credentials --hidden-import google_auth_oauthlib.flow --hidden-import google.auth.transport.requests)
          if [ -f "ruach_ai.png" ]; then
            EXTRA_ARGS+=(--add-data "ruach_ai.png:.")
          fi
          pyinstaller --noconsole --onefile --clean --name "RuachTodo" "${EXTRA_ARGS[@]}" "$ENTRY"

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuachTodo-Linux-Binary
          path: dist/RuachTodo

  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Ubuntu 24.04 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            lld ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install buildozer==1.6.0 "cython<3"

      - name: Cache Buildozer SDK, NDK, and downloaded packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-android-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'main.py', 'todo_logic.py', 'gcal_sync.py') }}
          restore-keys: |
            buildozer-android-v3-${{ runner.os }}-

      - name: Build Android debug APK
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "1"
          # p4a builds hostpython3 with -std=c11: CPython 3.11 needs POSIX
          # macros for off_t, and _PYTHONFRAMEWORK must be defined explicitly
          # because its generated pyconfig.h leaves the macro undefined.
          CFLAGS: '-D_GNU_SOURCE -D_PYTHONFRAMEWORK=\"\"'
        run: |
          yes | buildozer -v android debug

      - name: Verify APK output
        run: |
          ls -lh bin/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RuachTodo-Android-APK
          path: bin/*.apk
          if-no-files-found: warn